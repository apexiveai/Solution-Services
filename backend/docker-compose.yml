services:
  db:
    image: postgres:16-alpine
    container_name: aeop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aeop_db
      POSTGRES_USER: aeop_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5433:5432"
    volumes:
      - aeop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeop_user -d aeop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aeop_postgres_data:
